apply from: '../constants.gradle'
apply plugin: 'com.android.application'

android {
    namespace 'androidx.media3.demo.media'
    compileSdk 36

    // 读取 keystore.properties 文件
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    if (keystorePropertiesFile.exists()) {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    defaultConfig {
        applicationId 'com.anxiong666.www'
        versionName '3.2.0.79'
        versionCode 32079
        minSdkVersion 25
        targetSdkVersion 36
        
        // 支持多语言和资源
        vectorDrawables.useSupportLibrary = true
        
        // NDK ABI过滤（优化APK大小）
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
        
        // 多窗口和画中画支持
        resValue "bool", "supports_picture_in_picture", "true"
        
        // 渲染脚本支持
        renderscriptTargetApi 21
        renderscriptSupportModeEnabled true
        
        // 多 DEX 支持
        multiDexEnabled true
        
        // 编译选项优化
        javaCompileOptions {
            annotationProcessorOptions {
                arguments = [
                    "room.schemaLocation":"$projectDir/schemas".toString(),
                    "room.incremental":"true",
                    "room.expandProjection":"true"
                ]
            }
        }
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles = [
                getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro'
            ]
            // 使用 release 签名配置（如果存在）
            if (keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            } else {
                // 如果没有 keystore.properties，使用 debug 签名（仅用于开发）
                signingConfig signingConfigs.debug
            }
            
            // 优化构建
            zipAlignEnabled true
            crunchPngs true  // PNG优化
            
            // 调试选项
            debuggable false
            jniDebuggable false
            
            // 性能优化
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'  // 减小 APK 体积
            }
        }
        debug {
            jniDebuggable = true
            debuggable = true
            minifyEnabled false
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            
            // Debug 专用优化
            crunchPngs false  // 加快debug构建速度
        }
    }
    
    // 分包配置（优化启动速度）
    dexOptions {
        javaMaxHeapSize "4g"
        preDexLibraries true
    }
    
    // 编译优化
    compileOptions {
        incremental true
    }
    
    // 视频播放器专用配置
    packagingOptions {
        // 避免重复打包
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'
        
        // 排除不需要的文件
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
        exclude 'META-INF/*.kotlin_module'
        
        // 合并重复文件
        merge 'META-INF/versions/9/previous-compilation-data.bin'
    }
    
    // 视图绑定支持
    buildFeatures {
        viewBinding = true  // 启用ViewBinding提升性能
        dataBinding = false
        buildConfig = true
    }

    lintOptions {
        disable 'GoogleAppIndexingWarning', 'MissingTranslation', 'UnusedResources'
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        xmlReport false
        htmlReport true
    }
    
    // 资源优化
    androidResources {
        noCompress 'mp4', 'avi', 'mkv', 'mov'  // 视频文件不压缩
        additionalParameters '--no-version-vectors'  // 移除版本向量
    }
    
    buildToolsVersion '35.0.0'
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:" + desugarJdkLibsVersion
    compileOnly 'org.checkerframework:checker-qual:' + checkerframeworkVersion
    
    // AndroidX 核心库
    implementation 'androidx.annotation:annotation:' + androidxAnnotationVersion
    implementation 'androidx.appcompat:appcompat:' + androidxAppCompatVersion
    implementation 'androidx.core:core:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    
    // Material Design
    implementation 'com.google.android.material:material:' + androidxMaterialVersion
    
    // 下拉刷新
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    
    // Media3 播放器核心库
    implementation project(modulePrefix + 'lib-exoplayer')
    implementation project(modulePrefix + 'lib-ui')

    // 兼容版 MediaSession + MediaStyle 通知（用于锁屏 / 通知栏 / 蓝牙耳机控制）
    implementation 'androidx.media:media:' + androidxMediaVersion
    
    // 生命周期组件（优化内存管理）
    implementation 'androidx.lifecycle:lifecycle-runtime:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.7.0'
    
    // FileProvider 支持（文件共享功能）
    implementation 'androidx.core:core:1.13.0'
    
    // DocumentsProvider 支持（USB 文件访问）
    implementation 'androidx.documentfile:documentfile:1.0.1'
    
    // Glide 图片加载（视频缩略图）
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // 内存泄漏检测（仅Debug）
    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.12'
    
    // 性能监控
    implementation 'androidx.metrics:metrics-performance:1.0.0-beta01'
    
    // 多 DEX 支持
    implementation 'androidx.multidex:multidex:2.0.1'
}

